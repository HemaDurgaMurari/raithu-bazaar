spring.application.name=Raithu Bazaar
spring.config.import=optional:file:./application-local.properties
server.port=${PORT:8080}
spring.web.error.include-message=always
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/raithu_bazaar}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:local-only-change-this-secret-to-at-least-32-characters}
app.jwt.expiration-ms=86400000
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.support=${MAIL_SUPPORT:no.reply.raithubazaar@gmail.com}
app.payment.razorpay-key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay-key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.ai.provider=${AI_PROVIDER:ollama}
app.ai.ollama-url=${OLLAMA_URL:http://localhost:11434}
app.ai.ollama-model=${OLLAMA_MODEL:qwen3:4b}
app.ai.openrouter-url=${OPENROUTER_URL:https://openrouter.ai/api/v1}
app.ai.openrouter-model=${OPENROUTER_MODEL:openrouter/free}
app.ai.openrouter-api-key=${OPENROUTER_API_KEY:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
