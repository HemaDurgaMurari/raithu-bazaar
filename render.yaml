services:
  - type: web
    name: raithu-bazaar
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Render.Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: raithu-bazaar
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: raithu-bazaar
          envVarKey: RENDER_EXTERNAL_URL
